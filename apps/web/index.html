<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      B 站图片 CDN（i0/i1/i2.hdslb.com）有防盗链：带非 bilibili 来源的 Referer 会返回 403，
      不带 Referer 则 200。文档级设为 no-referrer，保证所有封面图请求都不带 Referer。
      组件上的 referrerPolicy="no-referrer" 仍然保留 —— 它管不到 CSS 背景图、
      懒加载竞态以及以后新增的代码路径，这一行是兜底。
    -->
    <meta name="referrer" content="no-referrer" />
    <!--
      把 http:// 的子资源自动升级为 https://。
      为什么需要：站点是 HTTPS，而 B 站部分头像（owner.face / staff.face）返回的是
      http URL，浏览器会报 Mixed Content 并拦截图片。
      后端已在数据出口统一转 https（internal/urlx），这里是**兜底** ——
      防止未来新增的数据路径漏掉转换（30 处 <img> 逐个加转换不现实）。
      注：upgrade-insecure-requests 只升级同源与子资源请求，不影响外链跳转。
    -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <!-- 站点图标：洛天依黑白线稿（矢量优先，PNG 兜底） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <title>虚拟歌手榜单</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
